
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-support-assistant"
version = "0.1.0"
description = "A document-grounded support assistant with retrieval evaluation and ticket classification"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "pypdf",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
